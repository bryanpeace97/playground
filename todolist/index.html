<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/todolist/">
    <link rel="stylesheet" href="css/style.css">
    <title>Prática To Do List</title>
</head>
<body>

    <svg class="svg-filters" aria-hidden="true" width="0" height="0">
        <defs>
            <filter id="glass-refraction" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
                <feTurbulence
                    type="fractalNoise"
                    baseFrequency="0.012 0.018"
                    numOctaves="2"
                    seed="7"
                    result="noise"
                />
                <feGaussianBlur in="noise" stdDeviation="1.2" result="softNoise" />
                <feDisplacementMap
                    in="SourceGraphic"
                    in2="softNoise"
                    scale="24"
                    xChannelSelector="R"
                    yChannelSelector="G"
                />
            </filter>
        </defs>
    </svg>

    <section class="container">

        <h1 class="text-center">To Do List com JavaScript</h1>
        <div class="card-stage">
            <img src="img/logobryan.svg" alt="" class="bg-logo" aria-hidden="true">
            <div class="glass-card">
                <div class="glass-refraction" aria-hidden="true"></div>
                <div class="upper-action">
                    <h3>Digite um novo item para a lista:</h3>
                    <div class="add-input">
                    <input type="text" name="text-item" id="">
                    <button type="button" class="btn-add" aria-label="Adicionar">
                        <svg class="btn-add__icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12.001 5v14.002m7.001-7H5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Adicionar</span>
                    </button>
                    </div>
                </div>
                
                <ul class="list">
                </ul>
            </div>
        </div>


    </section>

    <div class="tip" id="tip" role="status" aria-live="polite" hidden></div>

    <script src="js/app.js"></script>
</body>
</html>
